<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aanmeldformulier</title>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0a0a0f;
    color: #f1f1f1;
    min-height: 100vh;
    padding: 24px 16px;
    line-height: 1.5;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  h1 {
    font-size: 28px; margin: 0 0 8px;
    background: linear-gradient(90deg, #60a5fa, #c084fc, #f472b6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p.lead { color: #9ca3af; margin: 0; }
  form {
    background: #111118;
    border: 1px solid #262633;
    border-radius: 14px;
    padding: 22px;
    display: grid;
    gap: 18px;
  }
  label.lbl { font-size: 14px; font-weight: 500; color: #d1d5db; display: block; margin-bottom: 6px; }
  .req { color: #f87171; }
  input[type=text], input[type=email], input[type=tel], textarea, select {
    width: 100%;
    background: #07070b;
    border: 1px solid #2d2d3a;
    border-radius: 10px;
    padding: 10px 12px;
    color: #f1f1f1;
    font-size: 15px;
    font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #3b82f6; }
  textarea { resize: vertical; min-height: 120px; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: #d1d5db; }
  .check input { margin-top: 4px; }
  button {
    width: 100%;
    padding: 14px;
    background: #2563eb;
    color: white;
    border: 0;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: #3b82f6; }
  .success {
    background: #111118;
    border: 1px solid rgba(34,197,94,.4);
    border-radius: 14px;
    padding: 32px 24px;
    text-align: center;
  }
  .success h2 { color: #4ade80; margin: 0 0 8px; }
  .success p { color: #d1d5db; margin: 0 0 20px; }
  .again {
    background: #2563eb;
    color: white;
    border: 0;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  footer { margin-top: 24px; text-align: center; color: #6b7280; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Aanmeldformulier</h1>
    <p class="lead">Vul het formulier in. Geen account of login nodig — bij verzenden opent je mail-app met de antwoorden klaar om te versturen.</p>
  </header>

  <form id="f">
    <div>
      <label class="lbl">Naam <span class="req">*</span></label>
      <input type="text" name="naam" required>
    </div>
    <div>
      <label class="lbl">E-mailadres <span class="req">*</span></label>
      <input type="email" name="email" required>
    </div>
    <div>
      <label class="lbl">Telefoonnummer</label>
      <input type="tel" name="telefoon">
    </div>
    <div>
      <label class="lbl">Onderwerp</label>
      <input type="text" name="onderwerp">
    </div>
    <div>
      <label class="lbl">Bericht <span class="req">*</span></label>
      <textarea name="bericht" required></textarea>
    </div>
    <div>
      <label class="lbl">Hoe heb je ons gevonden?</label>
      <select name="bron">
        <option value="">Kies een optie</option>
        <option value="zoekmachine">Via een zoekmachine</option>
        <option value="social">Social media</option>
        <option value="vriend">Via vrienden / kennissen</option>
        <option value="anders">Anders</option>
      </select>
    </div>
    <label class="check">
      <input type="checkbox" name="akkoord" value="ja" required>
      <span>Ik ga akkoord met het verwerken van bovenstaande gegevens.</span>
    </label>
    <button type="submit">Verstuur</button>
  </form>

  <div id="ok" class="success" style="display:none;">
    <h2>Bedankt!</h2>
    <p>Je mail-app is geopend met je antwoorden. Tik op verzenden om te bevestigen.</p>
    <button class="again" type="button" onclick="resetForm()">Nog een antwoord versturen</button>
  </div>

  <footer>Gehost via jsDelivr CDN · geen tracking, geen login</footer>
</div>

<script>
  // Vervang dit door je eigen e-mailadres om antwoorden te ontvangen.
  var DESTINATION_EMAIL = 'change-me@example.com';

  var labels = {
    naam: 'Naam',
    email: 'E-mailadres',
    telefoon: 'Telefoonnummer',
    onderwerp: 'Onderwerp',
    bericht: 'Bericht',
    bron: 'Hoe gevonden',
    akkoord: 'Akkoord met verwerking'
  };

  document.getElementById('f').addEventListener('submit', function(e) {
    e.preventDefault();
    var fd = new FormData(e.target);
    var lines = [];
    Object.keys(labels).forEach(function(k) {
      var v = fd.get(k);
      if (v) lines.push(labels[k] + ': ' + v);
    });
    var subject = 'Nieuwe aanmelding van ' + (fd.get('naam') || 'onbekend');
    var body = lines.join('\n');
    var href = 'mailto:' + DESTINATION_EMAIL +
      '?subject=' + encodeURIComponent(subject) +
      '&body=' + encodeURIComponent(body);
    window.location.href = href;
    document.getElementById('f').style.display = 'none';
    document.getElementById('ok').style.display = 'block';
  });

  function resetForm() {
    document.getElementById('f').reset();
    document.getElementById('f').style.display = 'grid';
    document.getElementById('ok').style.display = 'none';
  }
</script>
</body>
</html>
